<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Página não encontrada</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg">
<style>
  :root { --bg:#FAFAF7; --fg:#0A0A0A; --fg-muted:#5C5C5A; --line:#E5E5E1; --accent-deep:#2563EB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card { max-width:480px; text-align:center; }
  .code { font-family:'JetBrains Mono',monospace; font-size:.75rem; letter-spacing:.18em; color:var(--fg-muted); text-transform:uppercase; margin-bottom:16px; }
  h1 { font-weight:500; font-size:2rem; letter-spacing:-.035em; margin-bottom:12px; }
  p { color:var(--fg-muted); margin-bottom:24px; }
  a { color:var(--accent-deep); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">erro 404</div>
    <h1>Página não encontrada.</h1>
    <p>O endereço não existe ou saiu do ar.</p>
    <a href="/">Ir para a página inicial</a>
  </div>
</body>
</html>
