<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Raphael Donô · Site em manutenção</title>
<meta name="description" content="Site em manutenção.">
<link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FAFAF7; --bg-2:#F2F2EE; --fg:#0A0A0A; --fg-muted:#5C5C5A; --fg-dim:#999996; --line:#E5E5E1; --accent:#3B82F6; --accent-deep:#2563EB; --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; --mono:'JetBrains Mono',monospace; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:var(--sans); background:var(--bg); color:var(--fg); display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; line-height:1.55; }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
  .card { max-width:560px; width:100%; text-align:center; }
  .mark { width:48px; height:48px; margin:0 auto 28px; }
  .eyebrow { display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border:1px solid var(--line); border-radius:999px; font-family:var(--mono); font-size:.72rem; color:var(--fg-muted); letter-spacing:.12em; text-transform:uppercase; margin-bottom:28px; }
  .eyebrow .d { width:6px; height:6px; border-radius:50%; background:var(--accent); }
  h1 { font-weight:500; font-size:clamp(2rem,5vw,3rem); letter-spacing:-.04em; line-height:1.05; margin-bottom:18px; }
  h1 .accent { color:var(--accent-deep); font-weight:600; }
  p { color:var(--fg-muted); font-size:1.05rem; max-width:420px; margin:0 auto; }
  footer { padding:24px; text-align:center; font-family:var(--mono); font-size:.68rem; color:var(--fg-dim); letter-spacing:.1em; border-top:1px solid var(--line); background:var(--bg-2); }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="mark" viewBox="0 0 160 160" style="color: var(--fg);" aria-hidden="true">
      <rect x="22" y="96" width="30" height="42" rx="8" fill="currentColor" opacity="0.3"/>
      <rect x="65" y="64" width="30" height="74" rx="8" fill="currentColor" opacity="0.6"/>
      <rect x="108" y="30" width="30" height="108" rx="8" fill="currentColor"/>
      <circle cx="123" cy="16" r="10" fill="var(--accent)"/>
    </svg>
    <div class="eyebrow"><span class="d"></span>Raphael Donô</div>
    <h1>Site em <span class="accent">manutenção.</span></h1>
    <p>Estamos preparando novidades. Em breve, esta página volta ao ar.</p>
  </div>
</main>
<footer>raphaeldono.com.br · 2026</footer>
</body>
</html>
